# Baseline 1 (WP8): LIB candidates by mass with spectral-match features (casmi.libmatch, PLAN 4.2)
# plus both DB tiers with priors; fallback fusion (PLAN 4.6) with the WP8 LIB rules.
# python scripts/predict.py --config configs/b1_library.yaml
#   -> submissions/YYYYMMDD_b1_library_prior.csv
#
# Tuned on validation (NP-TIMS and NP-OTHER, C1 with the C2 cost checked; NP tier pools,
# offline grid over the stored pools; see docs/EXPERIMENTS.md "WP8 tuning"), never on the
# public test. In short:
# - lib_best_cos is the best-graded pair over all spectrum and consensus pairs ("graded"): the
#   search's single best pair can be a 2-peak spectrum hiding a 20-peak match.
# - Plan rule 1 at 0.7 / 4 peaks hard-overrides the prior; that lifts C1 but costs more on C2.
#   Keeping the hard override only for near-identical spectra (>= 0.95) and otherwise ADDING
#   the similarity to the prior score (additive rule 1b) beats it on C1 and C2 of both sets.
# - Demoting LIB candidates whose spectra contradict the query (best cosine < 0.2) below every
#   NP-tier candidate improves C2 also on the pubmed_count = 0 subset (not a popularity effect)
#   for a small C1 cost.
submission_tag: b1_library_prior
pipeline_plugins: [casmi.libmatch]
pipeline_stages: [mass, pool, lib, features, score, assemble]
db_tiers: [np, pubchem]
n_jobs: 2                 # mkey worker processes
batch_molecules: 50       # about 10k candidates per molecule with PubChem (PLAN risk 14)
lib_mass_tol_ppm: 10.0
lib_sim: graded
fusion_lib_cos_min: 0.95          # rule 1 (3 + cos) only for near-identical spectra ...
fusion_lib_min_matched: 4         # ... with at least 4 matched peaks
fusion_lib_weak: true             # rule 1b, additive: rule 2 score + 1.0 x (cos - 0.5) / 0.5
fusion_lib_weak_additive: true
fusion_lib_weak_weight: 1.0
fusion_lib_weak_cos_min: 0.5
fusion_lib_weak_min_matched: 2
fusion_lib_demote: true           # measured best cosine < 0.2: below every NP-tier candidate
fusion_lib_demote_cos_max: 0.2
fusion_lib_demote_factor: 1.0
